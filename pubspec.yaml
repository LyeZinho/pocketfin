name: pocketfin
description: "Lightweight, offline-first expense tracker."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  file_saver: ^0.7.0
  fl_chart: ^1.3.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  share_plus: ^13.3.1
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#C6F432"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
